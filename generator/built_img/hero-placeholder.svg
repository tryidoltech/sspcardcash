<path d="M38 97h70M73 70v54M55 70v54M91 70v54" stroke="#E8A65E" stroke-width="3"/>
<g fill="#fff" opacity=".95" font-family="Arial, sans-serif" font-weight="700"><text x="38" y="190" font-size="30" letter-spacing="5">••••  ••••  ••••  4821</text><text x="38" y="250" font-size="17" opacity=".85" letter-spacing="2">CARDHOLDER NAME</text></g>
<g transform="translate(360 222)"><circle r="24" fill="#fff" opacity=".55"/><circle cx="30" r="24" fill="#fff" opacity=".85"/></g>
<path d="M412 70c14 12 14 34 0 46M396 80c8 7 8 19 0 26" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>
</g>
<!-- phone -->
<g transform="translate(640 140)" filter="url(#sh)">
<rect width="250" height="500" rx="38" fill="#0B1F21"/>
<rect x="12" y="12" width="226" height="476" rx="28" fill="#F4F8F7"/>
<rect x="95" y="24" width="60" height="10" rx="5" fill="#0B1F21"/>
<rect x="12" y="44" width="226" height="56" fill="#015B5D"/>
<circle cx="44" cy="72" r="16" fill="#FE7001"/><text x="44" y="78" text-anchor="middle" font-family="Arial" font-weight="800" font-size="15" fill="#fff">₹</text>
<rect x="70" y="62" width="100" height="10" rx="5" fill="#fff"/><rect x="70" y="78" width="60" height="7" rx="3.5" fill="#9FD0CB"/>
<rect x="30" y="122" width="160" height="56" rx="14" fill="#fff"/><rect x="44" y="136" width="120" height="9" rx="4.5" fill="#B8CBC9"/><rect x="44" y="154" width="84" height="9" rx="4.5" fill="#D3E0DE"/>
<rect x="64" y="196" width="156" height="70" rx="14" fill="#DDF5E6"/><rect x="78" y="212" width="120" height="9" rx="4.5" fill="#7FBF98"/><rect x="78" y="230" width="100" height="9" rx="4.5" fill="#A7D6B8"/><rect x="78" y="248" width="60" height="7" rx="3.5" fill="#A7D6B8"/>
<rect x="30" y="284" width="176" height="84" rx="14" fill="#fff"/><rect x="44" y="300" width="140" height="9" rx="4.5" fill="#B8CBC9"/><rect x="44" y="318" width="120" height="9" rx="4.5" fill="#D3E0DE"/><rect x="44" y="336" width="90" height="9" rx="4.5" fill="#D3E0DE"/>
<rect x="24" y="430" width="202" height="40" rx="20" fill="#fff" stroke="#D3E0DE"/><circle cx="206" cy="450" r="14" fill="#1FAF5A"/>
</g>
<!-- badge -->
<g transform="translate(560 560)" filter="url(#sh)">
<rect width="300" height="96" rx="22" fill="#fff"/>
<circle cx="50" cy="48" r="26" fill="#E8F3F2"/><path d="M38 48l9 9 17-18" stroke="#015B5D" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="92" y="30" width="170" height="13" rx="6.5" fill="#10292B"/><rect x="92" y="54" width="120" height="11" rx="5.5" fill="#B8CBC9"/>
</g>
<!-- coins -->
<g transform="translate(110 150)"><circle r="44" fill="#FFB067"/><circle r="34" fill="#FE7001"/><text y="13" text-anchor="middle" font-family="Arial" font-weight="800" font-size="38" fill="#fff">₹</text></g>
<g transform="translate(905 690)" opacity=".9"><circle r="30" fill="#FFB067"/><circle r="22" fill="#FE7001"/><text y="9" text-anchor="middle" font-family="Arial" font-weight="800" font-size="26" fill="#fff">₹</text></g>
