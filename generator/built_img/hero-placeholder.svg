<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-label="Illustration of a credit card and a phone showing an assistance request">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#023538"/><stop offset=".6" stop-color="#015B5D"/><stop offset="1" stop-color="#0B6E6B"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A2A"/><stop offset="1" stop-color="#E25A00"/></linearGradient>
<linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F7F6"/><stop offset="1" stop-color="#CFE3E1"/></linearGradient>
<radialGradient id="glow" cx=".8" cy=".2" r=".6"><stop offset="0" stop-color="#FE7001" stop-opacity=".45"/><stop offset="1" stop-color="#FE7001" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#01181A" flood-opacity=".35"/></filter>
</defs>
<rect width="1000" height="800" fill="url(#bg)"/>
<rect width="1000" height="800" fill="url(#glow)"/>
<g opacity=".08" stroke="#fff" stroke-width="2" fill="none"><circle cx="160" cy="640" r="180"/><circle cx="160" cy="640" r="260"/><circle cx="160" cy="640" r="340"/></g>
<!-- back card -->
<g transform="translate(130 250) rotate(-14)" filter="url(#sh)">
<rect width="460" height="290" rx="28" fill="url(#card2)"/>
<rect y="54" width="460" height="54" fill="#015B5D" opacity=".85"/>
<rect x="30" y="160" width="250" height="18" rx="9" fill="#9FBFBC"/>
<rect x="30" y="196" width="160" height="14" rx="7" fill="#B9D3D0"/>
</g>
